<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1f1a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCC624"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FCC624" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FCC624" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- terminal window -->
  <g transform="translate(760 92)">
    <rect width="440" height="270" rx="14" fill="#0b0f14" stroke="#30363d"/>
    <rect width="440" height="36" rx="14" fill="#21262d"/>
    <rect y="22" width="440" height="14" fill="#21262d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="18" r="6" fill="#27c93f"/>
    <text x="220" y="23" fill="#8b949e" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">bash — ~/history</text>
    <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16">
      <text x="20" y="72"><tspan fill="#3fb950">guest@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9">$ uname -s</tspan></text>
      <text x="20" y="98" fill="#c9d1d9">Linux</text>
      <text x="20" y="132"><tspan fill="#3fb950">guest@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9">$ git log --reverse | head -1</tspan></text>
      <text x="20" y="158" fill="#FCC624">0.01  17.09.1991  «just a hobby»</text>
      <text x="20" y="192"><tspan fill="#3fb950">guest@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9">$ wc -l kernel/*</tspan></text>
      <text x="20" y="218" fill="#c9d1d9">30 000 000+ строк</text>
      <text x="20" y="252"><tspan fill="#3fb950">guest@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9">$ </tspan><tspan fill="#FCC624">█</tspan></text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="128" fill="#8b949e" font-size="22" letter-spacing="6">1969 → СЕГОДНЯ</text>
    <text x="78" y="222" fill="#f0f6fc" font-size="92" font-weight="800">История</text>
    <text x="78" y="318" fill="url(#gold)" font-size="104" font-weight="800">Linux</text>
    <text x="80" y="372" fill="#c9d1d9" font-size="26">от «просто хобби» студента</text>
    <text x="80" y="406" fill="#c9d1d9" font-size="26">до системы, на которой работает мир</text>
  </g>

  <!-- timeline -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <line x1="80" y1="512" x2="1200" y2="512" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="512" x2="1200" y2="512" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1120" stroke-dashoffset="0" opacity="0.85"/>
    <g>
      <circle cx="100" cy="512" r="9" fill="#0d1117" stroke="#8b949e" stroke-width="3"/>
      <text x="100" y="490" fill="#f0f6fc" font-size="20" font-weight="700">1969</text>
      <text x="100" y="546" fill="#8b949e" font-size="16">Unix</text>
    </g>
    <g>
      <circle cx="285" cy="512" r="9" fill="#0d1117" stroke="#8b949e" stroke-width="3"/>
      <text x="285" y="490" fill="#f0f6fc" font-size="20" font-weight="700">1983</text>
      <text x="285" y="546" fill="#8b949e" font-size="16">GNU</text>
    </g>
    <g>
      <circle cx="470" cy="512" r="14" fill="#FCC624"/>
      <text x="470" y="486" fill="#FCC624" font-size="24" font-weight="800">1991</text>
      <text x="470" y="550" fill="#FCC624" font-size="17" font-weight="700">Linux 0.01</text>
    </g>
    <g>
      <circle cx="655" cy="512" r="9" fill="#0d1117" stroke="#FCC624" stroke-width="3"/>
      <text x="655" y="490" fill="#f0f6fc" font-size="20" font-weight="700">1993</text>
      <text x="655" y="546" fill="#8b949e" font-size="16">Debian</text>
    </g>
    <g>
      <circle cx="840" cy="512" r="9" fill="#0d1117" stroke="#FCC624" stroke-width="3"/>
      <text x="840" y="490" fill="#f0f6fc" font-size="20" font-weight="700">2005</text>
      <text x="840" y="546" fill="#8b949e" font-size="16">Git</text>
    </g>
    <g>
      <circle cx="1020" cy="512" r="9" fill="#0d1117" stroke="#FCC624" stroke-width="3"/>
      <text x="1020" y="490" fill="#f0f6fc" font-size="20" font-weight="700">2008</text>
      <text x="1020" y="546" fill="#8b949e" font-size="16">Android</text>
    </g>
    <g>
      <circle cx="1180" cy="512" r="9" fill="#0d1117" stroke="#FCC624" stroke-width="3"/>
      <text x="1180" y="490" fill="#f0f6fc" font-size="20" font-weight="700">2022</text>
      <text x="1180" y="546" fill="#8b949e" font-size="16">Rust</text>
    </g>
  </g>
  <text x="1200" y="610" fill="#484f58" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" text-anchor="end">github.com/justxor/linux-history</text>
</svg>
